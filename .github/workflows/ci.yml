name: CI

# Fast, signing-free build check. Confirms the app compiles on every PR (and on
# pushes to main) without needing any deploy secrets or code signing.
#
# Only runs when iOS code changes, to avoid burning macOS runner minutes on
# docs/web-only edits (macOS minutes bill at 10x on private repos).

on:
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ci.yml"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (simulator, no signing)
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project ios/Foodie.xcodeproj \
            -scheme Foodie \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
