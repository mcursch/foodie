# XcodeGen spec — FALLBACK project generator.
#
# The committed Foodie.xcodeproj already works in Xcode 16+. Use this only if you
# prefer to regenerate the project (or hit an Xcode-version issue):
#
#   brew install xcodegen
#   cd ios && xcodegen generate && open Foodie.xcodeproj
#
name: Foodie
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  Foodie:
    type: application
    platform: iOS
    sources:
      - path: Foodie
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.Foodie
        GENERATE_INFOPLIST_FILE: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_ASSET_PATHS: '"Foodie/Preview Content"'
        ENABLE_PREVIEWS: "YES"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
