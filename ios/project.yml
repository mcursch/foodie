# XcodeGen spec — FALLBACK project generator.
#
# The committed Foodie.xcodeproj already works in Xcode 16+. Use this only if you
# prefer to regenerate the project (or hit an Xcode-version issue):
#
#   brew install xcodegen
#   cd ios && xcodegen generate && open Foodie.xcodeproj
#
name: Foodie
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  Foodie:
    type: application
    platform: iOS
    sources:
      - path: Foodie
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.Foodie
        GENERATE_INFOPLIST_FILE: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_ASSET_PATHS: '"Foodie/Preview Content"'
        ENABLE_PREVIEWS: "YES"
        TARGETED_DEVICE_FAMILY: "1"
        # Declares the app exempt from export-compliance questions. Without this,
        # every TestFlight/App Store build stalls on "Missing Compliance".
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: "NO"
        # Shown in the camera-permission prompt the first time you tap Scan.
        INFOPLIST_KEY_NSCameraUsageDescription: "Foodie uses the camera to scan product barcodes so it can fill in calories and macros for you."
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
